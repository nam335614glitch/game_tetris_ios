name: Build iOS IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Flet CLI
        run: |
          pip install flet
          
      - name: Build IPA Thần Tốc
        run: |
          flet build ipa main.py --no-sign
          
      - name: Upload IPA Product
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-7Plus-Game
          path: build/ipa/*.ipa
